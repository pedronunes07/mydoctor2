{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emitir Receita/Atestado</title>
    <link href="{% static 'bootstrap.min.css' %}" rel="stylesheet">
    <link href="{% static 'style.css' %}" rel="stylesheet">
</head>
<body>
{% include 'todos/_navbar.html' with voltar_url=voltar_url %}
{% include 'todos/_messages.html' %}
<div class="container mt-4">
    <h3>Emitir documento - Consulta #{{ consulta.id }}</h3>
    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label for="tipo">Tipo</label>
            <select class="form-control" id="tipo" name="tipo">
                <option value="receita">Receita</option>
                <option value="atestado">Atestado</option>
            </select>
        </div>
        <div class="form-group mt-3">
            <label for="destinatario">Destinatário (empresa/escola/órgão)</label>
            <input class="form-control" id="destinatario" name="destinatario" placeholder="Ex.: Empresa XYZ Ltda.">
        </div>
        <div class="form-group mt-3">
            <label for="conteudo">Conteúdo</label>
            <textarea class="form-control" id="conteudo" name="conteudo" rows="8" placeholder="Instruções, medicamentos, CID, dosagens, período de afastamento etc."></textarea>
        </div>
        <button type="submit" class="btn btn-primary mt-3">Salvar</button>
        <a href="{% url 'doctor_dashboard' %}" class="btn btn-secondary mt-3">Cancelar</a>
    </form>
 </div>
</body>
</html>

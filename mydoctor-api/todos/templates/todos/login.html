{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
{% include 'todos/_head.html' with page_title='Login' %}
<body>
{% include 'todos/_navbar.html' with voltar_url=voltar_url %}
{% include 'todos/_messages.html' %}

<div class="md-auth-page">
  <div class="md-auth-card">
    <h2>Entrar</h2>
    <p class="md-auth-hint">Paciente: e-mail · Médico: CRM</p>
    <form method="post" class="md-auth-form" autocomplete="on">
      {% csrf_token %}
      <label class="md-auth-label" for="email">E-mail (paciente)</label>
      <input type="email" id="email" name="email" placeholder="seu@email.com" autocomplete="email">
      <label class="md-auth-label" for="crm">CRM (médico)</label>
      <input
        type="tel"
        id="crm"
        name="crm"
        placeholder="Ex.: 12345"
        autocomplete="username"
        inputmode="numeric"
        pattern="[0-9]+"
        maxlength="12"
        oninput="this.value = this.value.replace(/\D/g, '')"
        title="Digite apenas números">
      <label class="md-auth-label" for="password">Senha</label>
      <input type="password" id="password" name="password" required placeholder="••••••••" autocomplete="current-password">
      <input type="submit" value="Entrar" class="form-btn">
    </form>
    <p class="md-auth-footer">Não tem conta? <a href="{% url 'register' %}"><strong>Cadastre-se</strong></a></p>
  </div>
</div>

{% include 'todos/_footer.html' %}
</body>
</html>

{% if messages %}
<div class="md-main" style="padding-top:1rem;padding-bottom:0;max-width:720px;">
  {% for message in messages %}
  <div class="alert md-alert alert-{{ message.tags|default:'info' }} md-alert-{{ message.tags|default:'info' }}" role="alert">
    {{ message }}
  </div>
  {% endfor %}
</div>
{% endif %}

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="title desc">
  <title id="title">Cuidado humano — Bem-estar</title>
  <desc id="desc">Formas fluidas e paleta aconchegante representando bem-estar.</desc>
  <defs>
    <linearGradient id="g2" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" x2="1">
      <stop offset="0%" stop-color="#bbf7d0"/>
      <stop offset="100%" stop-color="#86efac"/>
    </linearGradient>
    <style>
      .h1{font:700 34px system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, sans-serif;fill:#f0fdf4}
      .p{font:400 16px system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, sans-serif;fill:#dcfce7}
    </style>
  </defs>
  <rect width="100%" height="100%" fill="url(#g2)" rx="24"/>
  <g opacity=".25">
    <circle cx="120" cy="80" r="80" fill="#ffffff"/>
    <circle cx="200" cy="120" r="60" fill="#ffffff"/>
    <circle cx="680" cy="90" r="70" fill="#ffffff"/>
  </g>
  <g transform="translate(480,120)">
    <path d="M60 0 C 90 40, 90 88, 60 120 C 30 88, 30 40, 60 0 Z" fill="url(#leaf)"/>
    <path d="M0 40 C 28 70, 28 98, 0 120 C -28 98, -28 70, 0 40 Z" fill="#a7f3d0"/>
  </g>
  <g transform="translate(56,70)">
    <text class="h1">Cuidado humano</text>
    <text class="p" y="28">Acolhimento e atenção em cada consulta.</text>
  </g>
</svg>



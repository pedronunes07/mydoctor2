<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="title desc">
  <title id="title">Consulta online — Conexão</title>
  <desc id="desc">Ilustração suave com formas orgânicas e conexão entre pontos.</desc>
  <defs>
    <linearGradient id="g1" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <style>
      .h1{font:700 36px system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, sans-serif;fill:#fff}
      .p{font:400 16px system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, sans-serif;fill:#eaf2ff}
    </style>
  </defs>
  <rect width="100%" height="100%" fill="url(#g1)" rx="24"/>
  <circle cx="620" cy="80" r="160" fill="url(#glow)"/>
  <g stroke="#fff" stroke-opacity=".5" fill="none">
    <path d="M80 260 C 180 200, 260 220, 360 180 S 560 140, 720 220" stroke-width="2"/>
    <path d="M80 300 C 180 240, 260 260, 360 220 S 560 180, 720 260" stroke-width="2"/>
  </g>
  <g>
    <circle cx="160" cy="240" r="26" fill="#fff"/>
    <circle cx="400" cy="200" r="26" fill="#fff"/>
    <circle cx="640" cy="240" r="26" fill="#fff"/>
  </g>
  <g transform="translate(48,64)">
    <text class="h1">Atendimento online</text>
    <text class="p" y="28">Conecte-se a médicos de forma simples e rápida.</text>
  </g>
</svg>


